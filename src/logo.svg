<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .stroke { fill: none; stroke: #C6A15B; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .fill { fill: #3A1220; }
      .accent { fill: #C6A15B; }
    </style>
  </defs>

  <!-- head + ears, single continuous outline -->
  <path class="stroke" d="
    M 62 58
    L 50 24
    L 78 46
    C 85 43 92 43 100 43
    C 108 43 115 43 122 46
    L 150 24
    L 138 58
    C 148 68 154 82 154 97
    C 154 126 130 150 100 150
    C 70 150 46 126 46 97
    C 46 82 52 68 62 58
    Z
  " />

  <!-- inner ear detail -->
  <path class="stroke" d="M 58 38 L 66 55" />
  <path class="stroke" d="M 142 38 L 134 55" />

  <!-- eyes -->
  <ellipse class="fill" cx="82" cy="92" rx="4.5" ry="6.5" />
  <ellipse class="fill" cx="118" cy="92" rx="4.5" ry="6.5" />

  <!-- nose: small heart -->
  <path class="accent" d="
    M 100 106
    C 97 102 91 102 91 107.5
    C 91 112 96 115 100 119
    C 104 115 109 112 109 107.5
    C 109 102 103 102 100 106
    Z
  " />

  <!-- whiskers -->
  <path class="stroke" d="M 38 100 L 62 103" />
  <path class="stroke" d="M 38 112 L 62 111" />
  <path class="stroke" d="M 162 100 L 138 103" />
  <path class="stroke" d="M 162 112 L 138 111" />
</svg>
